# MySQL 配置
[mysql]
host = localhost
user = root
password = your_mysql_password
database = enterprise_kg

# Redis 配置
[redis]
host = localhost
port = 16379
password = your_redis_password
db = 0

# Milvus 配置  # 手动创建下库 enterprise
[milvus]
host = localhost
port = 19530
database_name = enterprise
collection_name = enterprise_rag

# 日志配置
[logger]
log_file = logs/app.log

# 检索参数配置
[retrieval]
parent_chunk_size = 1000
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 10
candidate_m = 3


# LLM 配置
[llm]
model = qwen-plus
;dashscope_api_key = 旧密钥已移除，请填入新密钥
;dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
dashscope_api_key = 请填写你的DashScope密钥


# 应用配置
[app]
valid_sources = ["product", "tech", "hr", "admin"]
customer_service_phone = 企业客服
